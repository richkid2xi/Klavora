version: '3.9'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://klavora_user:password@db:5432/klavora_db
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: klavora_db
      POSTGRES_USER: klavora_user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: